<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KoyotaHUB</title>

<style>
:root{
  color-scheme:dark;
  --bg:#000;
  --panel:#080808;
  --line:#242424;
  --text:#eee;
  --muted:#777;
  --hover:#111;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
}

body{
  color:var(--text);
  font:14px/1.6 Inter,ui-sans-serif,system-ui,-apple-system,
       BlinkMacSystemFont,"Segoe UI",sans-serif;
}

main{
  max-width:980px;
  margin:auto;
  padding:56px 24px 80px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  margin-bottom:80px;
}

.brand{
  font-weight:650;
  letter-spacing:-.03em;
  font-size:20px;
}

.status{
  font-size:11px;
  color:#666;
  letter-spacing:.12em;
}

.intro{
  margin-bottom:42px;
}

.eyebrow{
  font-size:11px;
  color:#555;
  letter-spacing:.16em;
  text-transform:uppercase;
}

.intro h1{
  font-size:clamp(36px,7vw,66px);
  line-height:1.05;
  letter-spacing:-.065em;
  font-weight:600;
  margin:14px 0;
}

.intro p{
  color:#777;
  margin:0;
  max-width:420px;
}

.section{
  margin-top:48px;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  border-bottom:1px solid var(--line);
  padding-bottom:12px;
}

.section h2{
  font-size:12px;
  font-weight:600;
  letter-spacing:.13em;
  text-transform:uppercase;
  margin:0;
}

.count{
  color:#555;
  font-size:12px;
}

.item{
  display:flex;
  align-items:center;
  gap:18px;
  padding:19px 0;
  border-bottom:1px solid #171717;
  text-decoration:none;
  color:inherit;
  transition:
    background .18s,
    padding .18s;
}

.item:hover{
  background:var(--hover);
  padding-left:12px;
  padding-right:12px;
}

.num{
  color:#444;
  font-variant-numeric:tabular-nums;
  width:25px;
  flex-shrink:0;
}

.item-main{
  flex:1;
  min-width:0;
}

.name{
  font-size:15px;
  font-weight:520;
  letter-spacing:-.015em;
}

.desc{
  font-size:12px;
  color:#666;
  margin-top:2px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.link-url{
  font-size:12px;
  color:#666;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.arrow{
  color:#555;
  flex-shrink:0;
}

.empty{
  padding:24px 0;
  color:#555;
}

.footer{
  margin-top:80px;
  color:#444;
  font-size:11px;
  display:flex;
  justify-content:space-between;
  gap:20px;
  flex-wrap:wrap;
}

@media(max-width:520px){

  main{
    padding:32px 18px 60px;
  }

  .top{
    margin-bottom:60px;
  }

  .item{
    gap:10px;
  }

  .num{
    width:18px;
  }

  .name{
    font-size:14px;
  }
}
</style>
</head>

<body>

<main>

<header class="top">
  <div class="brand">KoyotaHUB</div>
  <div class="status" id="status">CONNECTING</div>
</header>

<section class="intro">
  <div class="eyebrow">A small collection</div>
  <h1>Koyota HUB.</h1>
  <p>
    Useful things, small experiments, and links collected in one place.
  </p>
</section>

<section class="section">

  <div class="section-head">
    <h2>Works</h2>
    <span class="count" id="workCount">—</span>
  </div>

  <div id="works">
    <div class="empty">Loading repository…</div>
  </div>

</section>

<section class="section">

  <div class="section-head">
    <h2>Links</h2>
    <span class="count" id="linkCount">—</span>
  </div>

  <div id="links">
    <div class="empty">Loading links…</div>
  </div>

</section>

<footer class="footer">
  <span>KoyotaHUB · github pages</span>
  <span id="updated">—</span>
</footer>

</main>


<script>

/* =========================================================
   CONFIG
========================================================= */

const OWNER = 'mjpgang';
const REPO  = 'hubsys';
const BRANCH = 'main';

/*
 * Worksを開く先
 *
 * 例:
 * test.html
 * ↓
 * https://koyota.f5.si/test.html
 */
const WORK_HOST = 'https://koyota.f5.si/';

/*
 * 自動更新間隔
 *
 * GitHub APIのレート制限を考慮して10秒。
 */
const REFRESH_INTERVAL = 10000;

/*
 * APIが固まった場合に永久Loadingにしない。
 */
const API_TIMEOUT = 8000;


/* =========================================================
   HELPERS
========================================================= */

const $ = id =>
  document.getElementById(id);


const esc = value =>
  String(value).replace(
    /[&<>"']/g,
    c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c])
  );


/* =========================================================
   GITHUB API
========================================================= */

async function githubAPI(path = ''){

  const controller = new AbortController();

  const timer = setTimeout(
    () => controller.abort(),
    API_TIMEOUT
  );

  try{

    const url =
      'https://api.github.com/repos/' +
      OWNER + '/' +
      REPO +
      '/contents/' +
      path +
      '?ref=' +
      encodeURIComponent(BRANCH) +
      '&_=' +
      Date.now();

    const response = await fetch(url,{
      method:'GET',
      cache:'no-store',
      signal:controller.signal,
      headers:{
        'Accept':'application/vnd.github+json',
        'Cache-Control':'no-cache',
        'Pragma':'no-cache'
      }
    });

    if(response.status === 403 ||
       response.status === 429){

      throw new Error('RATE_LIMIT');
    }

    if(!response.ok){

      throw new Error(
        'HTTP_' + response.status
      );
    }

    return await response.json();

  }finally{

    clearTimeout(timer);

  }
}


/* =========================================================
   FILENAME
========================================================= */

function fileName(name){

  const match =
    name.match(
      /^(.*?)(?::(.*?))?\.html$/i
    );

  if(!match){
    return null;
  }

  return {
    name:match[1],
    desc:match[2] || 'HTML work'
  };
}


/* =========================================================
   WORKS
========================================================= */

function renderWorks(files){

  const items =
    files
      .filter(file =>
        file.type === 'file' &&
        /\.html$/i.test(file.name) &&
        file.name.toLowerCase() !== 'index.html'
      )
      .map(file => ({
        file,
        meta:fileName(file.name)
      }))
      .filter(item => item.meta);


  $('workCount').textContent =
    String(items.length).padStart(2,'0');


  if(!items.length){

    $('works').innerHTML =
      '<div class="empty">No works found.</div>';

    return;
  }


  $('works').innerHTML =
    items.map((item,index) => {

      /*
       * GitHubのRawではなく
       *
       * https://koyota.f5.si/ファイル名.html
       *
       * を使用。
       */

      const url =
        WORK_HOST +
        encodeURIComponent(item.file.name);


      return `
        <a
          class="item"
          href="${esc(url)}"
          target="_blank"
          rel="noopener"
        >

          <span class="num">
            ${String(index + 1).padStart(2,'0')}
          </span>

          <span class="item-main">

            <div class="name">
              ${esc(item.meta.name)}
            </div>

            <div class="desc">
              ${esc(item.meta.desc)}
            </div>

          </span>

          <span class="arrow">↗</span>

        </a>
      `;

    }).join('');
}


/* =========================================================
   LINKS
========================================================= */

async function loadLinks(){

  try{

    const url =
      'https://raw.githubusercontent.com/' +
      OWNER + '/' +
      REPO + '/' +
      BRANCH +
      '/link.txt?_=' +
      Date.now();


    const controller =
      new AbortController();


    const timer =
      setTimeout(
        () => controller.abort(),
        API_TIMEOUT
      );


    try{

      const response =
        await fetch(url,{
          cache:'no-store',
          signal:controller.signal,
          headers:{
            'Cache-Control':'no-cache',
            'Pragma':'no-cache'
          }
        });


      if(!response.ok){
        throw new Error(
          'LINK_HTTP_' +
          response.status
        );
      }


      const text =
        await response.text();


      renderLinks(text);


    }finally{

      clearTimeout(timer);

    }

  }catch(error){

    console.error(
      'link.txt:',
      error
    );

    renderLinks('');

  }
}


/* =========================================================
   RENDER LINKS
========================================================= */

function renderLinks(text){

  const lines =
    text
      .split(/\r?\n/)
      .map(line => line.trim())
      .filter(Boolean)
      .filter(line => !line.startsWith('#'));


  const items =
    lines
      .map(line => {

        const match =
          line.match(
            /^(.+?)\s*\|\s*(https?:\/\/\S+)$/
          );


        if(match){

          return {
            name:match[1],
            url:match[2]
          };

        }


        return {
          name:line,
          url:line
        };

      })
      .filter(item =>
        /^https?:\/\//.test(item.url)
      );


  $('linkCount').textContent =
    String(items.length).padStart(2,'0');


  if(!items.length){

    $('links').innerHTML =
      '<div class="empty">No links found.</div>';

    return;
  }


  $('links').innerHTML =
    items.map((item,index) => `

      <a
        class="item"
        href="${esc(item.url)}"
        target="_blank"
        rel="noopener"
      >

        <span class="num">
          ${String(index + 1).padStart(2,'0')}
        </span>

        <span class="item-main">

          <div class="name">
            ${esc(item.name)}
          </div>

          <div class="link-url">
            ${esc(item.url)}
          </div>

        </span>

        <span class="arrow">↗</span>

      </a>

    `).join('');
}


/* =========================================================
   REFRESH
========================================================= */

let refreshing = false;


async function refresh(){

  /*
   * 前回の通信がまだ終わっていれば
   * 二重実行しない。
   */

  if(refreshing){
    return;
  }


  refreshing = true;


  $('status').textContent =
    'SYNCING';


  try{

    /*
     * GitHub Repository取得
     */

    const files =
      await githubAPI('');


    /*
     * Works表示
     */

    renderWorks(files);


    /*
     * link.txt取得
     */

    await loadLinks();


    /*
     * 成功
     */

    $('status').textContent =
      'ONLINE';


    $('updated').textContent =
      'SYNCED · ' +
      new Date().toLocaleTimeString(
        'ja-JP',
        {
          hour:'2-digit',
          minute:'2-digit',
          second:'2-digit'
        }
      );


  }catch(error){

    console.error(
      'Repository:',
      error
    );


    /*
     * タイムアウト
     */

    if(error.name === 'AbortError'){

      $('status').textContent =
        'TIMEOUT';


      /*
       * Loadingを永久に残さない
       */

      $('works').innerHTML =
        '<div class="empty">Repository request timed out.</div>';

    }


    /*
     * Rate Limit
     */

    else if(
      error.message === 'RATE_LIMIT'
    ){

      $('status').textContent =
        'RATE LIMITED';


      $('works').innerHTML =
        '<div class="empty">GitHub API rate limit reached.</div>';

    }


    /*
     * その他のエラー
     */

    else{

      $('status').textContent =
        'OFFLINE';


      $('works').innerHTML =
        '<div class="empty">Repository could not be loaded.</div>';

    }


    /*
     * Links側も永久Loadingにしない
     */

    if(
      $('links').textContent.includes(
        'Loading links'
      )
    ){

      $('links').innerHTML =
        '<div class="empty">Links could not be loaded.</div>';

    }


  }finally{

    /*
     * ここが重要。
     *
     * 成功しても失敗しても必ず解除。
     * これがないと永久SYNCINGになる。
     */

    refreshing = false;

  }

}


/* =========================================================
   AUTO REFRESH
========================================================= */

setInterval(
  () => {

    /*
     * ページが見えている時だけ更新。
     */

    if(
      document.visibilityState === 'visible'
    ){

      refresh();

    }

  },
  REFRESH_INTERVAL
);


/* =========================================================
   TAB RETURN
========================================================= */

document.addEventListener(
  'visibilitychange',
  () => {

    if(
      document.visibilityState === 'visible'
    ){

      refresh();

    }

  }
);


/* =========================================================
   PAGE RESTORE
========================================================= */

window.addEventListener(
  'pageshow',
  () => {

    refresh();

  }
);


/* =========================================================
   FIRST LOAD
========================================================= */

refresh();

</script>

</body>
</html>
